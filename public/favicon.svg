<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0080ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="128" height="128" fill="#0a0a0f" rx="16"/>
  
  <!-- Outer glow circle -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#neonGlow)" stroke-width="1" opacity="0.3"/>
  
  <!-- S Letter -->
  <path d="M 45 38 Q 38 38 38 45 Q 38 52 45 52 L 58 52 Q 65 52 65 59 Q 65 66 58 66 L 42 66" 
        fill="none" 
        stroke="url(#neonGlow)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- A Letter -->
  <path d="M 70 90 L 82 62 L 94 90 M 75 78 L 89 78" 
        fill="none" 
        stroke="url(#neonGlow)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Accent dots (star-like) -->
  <circle cx="30" cy="30" r="2" fill="#00f5ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="98" cy="98" r="2" fill="#ff00ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="98" cy="30" r="1.5" fill="#0080ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner ring for depth -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#neonGlow)" stroke-width="0.5" opacity="0.2"/>
</svg>
