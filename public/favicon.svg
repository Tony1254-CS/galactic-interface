<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" fill="#0a0a1a" rx="16"/>
  
  <!-- S Letter -->
  <path d="M 35 35 Q 35 25 45 25 L 55 25 Q 65 25 65 35 Q 65 45 55 45 L 45 45 Q 35 45 35 55 Q 35 65 45 65 L 55 65 Q 65 65 65 55" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="4" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- A Letter -->
  <path d="M 70 65 L 85 25 L 100 65 M 77 50 L 93 50" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Accent line -->
  <line x1="20" y1="80" x2="108" y2="80" 
        stroke="url(#neonGrad)" 
        stroke-width="2" 
        opacity="0.6"
        filter="url(#glow)"/>
  
  <!-- Tech dots -->
  <circle cx="25" cy="95" r="2" fill="#00ffff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="45" cy="95" r="2" fill="#ff00ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="65" cy="95" r="2" fill="#00ffff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="85" cy="95" r="2" fill="#ff00ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="105" cy="95" r="2" fill="#00ffff" opacity="0.8" filter="url(#glow)"/>
</svg>
